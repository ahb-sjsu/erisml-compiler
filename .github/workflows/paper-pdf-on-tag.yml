name: Archive paper PDF on tag

# When a `v*` tag is pushed, build the JOSS PDF and commit it to
# main under `paper-pdfs/paper-{version}.pdf`. Lets anyone read
# the typeset paper for a given release without authenticating
# to GitHub Actions or downloading a workflow artifact.
#
# Tradeoff: each release adds ~140 KB of binary to the repo. Over
# 100 releases that's ~14 MB. If this becomes a problem, migrate
# to a separate `paper-archive` branch (orphan, doesn't add to
# main's history) or git-lfs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to archive (e.g. v0.9.0). Defaults to the latest tag if blank."
        required: false
        default: ''

permissions:
  contents: write

jobs:
  archive-pdf:
    name: Build + commit paper PDF
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -e
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout the tag's paper sources into a temp dir
        run: |
          set -e
          git worktree add /tmp/tag-paper "${{ steps.tag.outputs.tag }}" -- paper
          ls /tmp/tag-paper/paper

      - name: Copy tag's paper sources into the worktree for building
        run: |
          mkdir -p paper-build
          cp -r /tmp/tag-paper/paper/* paper-build/
          ls -la paper-build/

      - name: Build JOSS PDF (against tagged paper sources)
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper-build/paper.md

      - name: Place PDF under paper-pdfs/
        run: |
          set -e
          mkdir -p paper-pdfs
          cp paper-build/paper.pdf "paper-pdfs/paper-${{ steps.tag.outputs.version }}.pdf"
          ls -lh paper-pdfs/

      - name: Commit + push if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean up build artifacts; only commit the archived PDF.
          rm -rf paper-build
          git worktree remove /tmp/tag-paper --force

          git add paper-pdfs/paper-${{ steps.tag.outputs.version }}.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit (PDF already archived?)"
            exit 0
          fi

          git commit -m "paper: archive PDF for ${{ steps.tag.outputs.tag }}

Auto-generated by .github/workflows/paper-pdf-on-tag.yml from
the paper/ sources at tag ${{ steps.tag.outputs.tag }}."
          git push origin main
