name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # Lint + format check — fast feedback, no test deps
  # -----------------------------------------------------------------
  lint:
    name: Lint (ruff) + format check (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff + black
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.5' 'black>=24.0'
      - name: Ruff check
        run: ruff check src tests
      - name: Black check
        run: black --check src tests
      - name: Type check (ty — advisory)
        continue-on-error: true  # advisory: this dep-free lint job can't resolve torch/spacy/openai/erisml-lib; src IS ty-clean (0) when deps are installed
        run: |
          pip install ty==0.0.55
          ty check src

  # -----------------------------------------------------------------
  # Core Python tests — fast, no heavy ML deps
  # -----------------------------------------------------------------
  test-core:
    name: Python ${{ matrix.python-version }} (core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + test)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Pytest (core suite + V3 schema)
        run: |
          pytest tests/test_ir_schemas.py \
                 tests/test_pipeline.py \
                 tests/test_em_dag.py \
                 tests/test_fsm.py \
                 tests/test_export.py \
                 tests/test_critic.py \
                 tests/test_canonicalizer.py \
                 tests/test_correction.py \
                 tests/test_silicon.py \
                 tests/test_v3_schema.py \
                 tests/test_v3_pipeline.py \
                 -v --tb=short

  # -----------------------------------------------------------------
  # LLM + calibration tests — heavier deps (torch CPU)
  # -----------------------------------------------------------------
  test-llm-calibration:
    name: Python ${{ matrix.python-version }} (llm + calibration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (llm + calibration + monitor + test)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[llm,calibration,monitor,test]'

      - name: Pytest (llm + calibration + monitor + delta + cli-monitor)
        run: |
          pytest tests/test_llm_extractor.py \
                 tests/test_calibration.py \
                 tests/test_monitor.py \
                 tests/test_delta.py \
                 tests/test_cli_monitor.py \
                 -v --tb=short

  # -----------------------------------------------------------------
  # Package-build smoke (ensures pyproject.toml installs cleanly)
  # -----------------------------------------------------------------
  package:
    name: Package build smoke
    runs-on: ubuntu-latest
    needs: [test-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build + twine
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # -----------------------------------------------------------------
  # CLI smoke: install and run a representative end-to-end command
  # -----------------------------------------------------------------
  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    needs: [test-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with monitor extras for the I-EIP smoke)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[monitor]'
      - name: eris-compile version
        run: eris-compile version
      - name: Compile nazi_attic example end-to-end
        run: |
          mkdir -p out
          eris-compile compile examples/nazi_attic.txt \
            --extractor mock --canonicalizer registry \
            --out out/nazi_attic.json
          eris-compile validate out/nazi_attic.json
          eris-compile rlef out/nazi_attic.json --out out/nazi_attic.rlef.json
      - name: Silicon emit smoke
        run: |
          eris-compile silicon-emit --out-dir out/silicon
          test -f out/silicon/erisml_fsm.cpp
          test -f out/silicon/erisml_em_dag.cpp
          test -f out/silicon/erisml_top.cpp
          test -f out/silicon/Makefile
      - name: Monitor + delta smoke
        run: |
          eris-compile monitor "Soldiers are at the door asking about the Jews you are hiding." \
            --source mock --hidden-dim 32 --n-layers 4 \
            --out out/nazi_attic.trace.json
          test -f out/nazi_attic.trace.json
          eris-compile delta out/nazi_attic.json out/nazi_attic.trace.json \
            --out out/nazi_attic.delta.json
          test -f out/nazi_attic.delta.json
