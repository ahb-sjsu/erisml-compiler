[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erisml-compiler"
version = "0.3.0"
description = "Structure-preserving compiler from natural language to ErisML"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew H. Bond", email = "andrew.bond@sjsu.edu" }]
keywords = ["ethics", "ai-safety", "geometric-ethics", "moral-reasoning", "compiler", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "httpx>=0.27",
]
ml = [
    "sentence-transformers>=2.7",
    "numpy>=1.24",
]
calibration = [
    "torch>=2.1",
    "sentence-transformers>=2.7",
    "numpy>=1.24",
    "tqdm>=4.66",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
eris-compile = "erisml_compiler.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erisml_compiler = ["ontology/*.yaml", "annotation/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
