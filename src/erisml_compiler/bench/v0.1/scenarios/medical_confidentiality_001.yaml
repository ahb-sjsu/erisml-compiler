scenario_id: medical_confidentiality_001
category: medical_confidentiality
source: "Tarasoff v. Regents of the University of California (variant). Bundled example."
license: MIT

raw_text: |
  Dr. M has been treating a patient for severe depression over six months
  and is bound by medical confidentiality as a treating physician.

  During today's session the patient revealed a detailed and credible plan
  to seriously harm an identifiable former colleague within the next week.

  Dr. M must decide whether the duty to warn the threatened party overrides
  the standing confidentiality obligation owed to the patient, and whether
  public-safety obligations to the broader community are also implicated.

expected:
  canonical_form: professional_privilege_versus_duty_to_warn
  stakeholders:
    - id: physician
      type: individual
      roles: [agent, professional_duty_bearer]
    - id: patient
      type: individual
      roles: [confider, dependent]
    - id: threatened_colleague
      type: individual
      roles: [patient, beneficiary, third_party]
    - id: public
      type: community
      roles: [nonconsenting_third_party]
  commitments:
    - holder: physician
      beneficiary: patient
      type: role_duty
  ethical_fact_kinds: [care, legitimacy, coercion]
  per_party_verdicts:
    physician: permit
    patient: forbid
    threatened_colleague: prefer
    public: prefer
  overall_verdict: permitted
  expect_premature_contraction: false
