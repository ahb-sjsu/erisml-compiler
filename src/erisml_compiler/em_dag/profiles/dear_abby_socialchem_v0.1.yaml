name: dear_abby_socialchem_v0.1
description: Per-EM-module weights derived from the Dear Abby slice of Social Chem
  101 (Forbes et al., EMNLP 2020).
ethos_description: 'Per-EM-module weights fit to AI2 crowd-workers'' rule-of-thumb
  tags on the Dear Abby slice of Social Chem 101 (Forbes et al., EMNLP 2020). Amplifies
  the moral channels Dear Abby''s audience-and-editor jointly surface as load-bearing:
  care/harm, fidelity/loyalty, fairness, and legitimacy/authority. EM modules with
  no MFT mapping (epistemic, autonomy, externality, repair) receive the floor weight;
  that''s a real coverage gap in the source corpus, not a bug in the fit. Verdict
  signs come from AI2 workers reading the original letters, NOT from the columnist''s
  published replies.'
bias_notes:
- 'Source self-selection: Dear Abby''s letter-writers (and her newspaper editor) skew
  toward certain concerns — family/relational — and silent concerns are underrepresented.'
- 'Time slice: 1985-2017 letters. Cultural mores from that window, particularly U.S.
  middle-class.'
- 'No columnist verdicts: the Kaggle questions-only data was supplanted by Social
  Chem because the latter has explicit verdict labels — but those labels still come
  from AI2 workers, not from Abby herself.'
- AI2 MTurk worker demographics (US, 2020-skewed). Verdict directions reflect what
  those workers thought the situation's moral judgment was, not necessarily what the
  original source's audience would say.
- Moral Foundations Theory's 5 channels do not partition the EM-DAG's 10 modules.
  Epistemic, autonomy, externality, and repair receive no MFT signal — their fitted
  weight is the floor, not a fitted score. The `coverage:` field per module in this
  YAML makes that gap explicit.
- Hand-curated MFT -> EM mapping (see `mft_to_em_mapping:` field). Tuning those weights
  changes the fitted profile. Treat the mapping as a transparent default that callers
  can override.
